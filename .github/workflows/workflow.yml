name: Build and Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v2
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.8'

    - name: Install dependencies
      working-directory: ${{ github.workspace }}
      run: |
        python -m pip install --upgrade pip
        pip install -r src/requirements.txt

    - name: Build with PyInstaller
      working-directory: ${{ github.workspace }}/src
      run: 
        python -m PyInstaller helper.spec

    - name: Get Current Tag
      id: get_tag
      run: |
        # Get the tag that triggered this workflow
        $tagRef = "${{ github.ref }}"
        if ($tagRef -match '^refs/tags/(.+)$') {
          $tagName = $matches[1]
          Write-Host "Current tag: $tagName"
        } else {
          Write-Error "Unable to extract tag from ref: $tagRef"
          exit 1
        }
        
        "TAG_NAME=$tagName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
        Write-Host "Using tag: $tagName"

    - name: Verify Tag Name
      run: |
        Write-Host "TAG_NAME environment variable: $env:TAG_NAME"
        if (-not $env:TAG_NAME) {
          Write-Error "TAG_NAME is not set!"
          exit 1
        }

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ env.TAG_NAME }}
        files: |
          src/dist/POE_Helper.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}